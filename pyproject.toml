[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-serverless-worker"
version = "1.0.0"
description = "RunPod serverless worker for ComfyUI image generation/editing (FLUX.2 klein 4B, Qwen-Image-Edit-2511)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "video_gen image serverless worker" }]
keywords = ["runpod", "serverless", "comfyui", "image", "keyframe", "flux2", "qwen-image"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# The worker executes a prepared ComfyUI API graph and returns
# `{image|image_url, telemetry}` (contract/worker-contract.md).
dependencies = [
    "httpx>=0.27,<0.29",
    "runpod==2.2.1",
    "boto3>=1.35",
]

[project.scripts]
image-worker = "image_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
